<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Caller</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 3rem 1.5rem;
      }
      button {
        border: 1px solid #cbd5e1;
        background: white;
        color: #0f172a;
        padding: 0.9rem 1.25rem;
        border-radius: 0.75rem;
        cursor: pointer;
        font-size: 1rem;
        margin-bottom: 0.75rem;
        width: 100%;
        text-align: left;
      }
      button:hover {
        border-color: #60a5fa;
        box-shadow: 0 10px 30px rgba(96, 165, 250, 0.12);
      }
      pre {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        padding: 1rem;
        border-radius: 0.75rem;
        overflow: auto;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.45rem 0.85rem;
        background: #e0f2fe;
        border-radius: 9999px;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Demo Caller Page</h1>
      <p>
        This page represents the original caller. It opens the mounted demo and accepts the returned record payload.
      </p>
      <div class="pill">Callback URL: <strong id="callback-url"></strong></div>

      <div id="buttons"></div>

      <section id="result-section" style="margin-top: 2rem; display: none;">
        <h2>Returned Demo Payload</h2>
        <pre id="result-json"></pre>
      </section>
    </main>

    <script>
      const callbackUrl = window.location.origin + window.location.pathname;
      document.getElementById("callback-url").textContent = callbackUrl;

      const scenarios = [
        { key: "happy", label: "Happy Path" },
        { key: "basic-exception", label: "Basic Exception" },
        { key: "complex-exception", label: "Complex Exception" },
      ];

      const buttons = document.getElementById("buttons");
      scenarios.forEach((scenario) => {
        const button = document.createElement("button");
        button.textContent = `Open mounted demo: ${scenario.label}`;
        button.addEventListener("click", () => {
          const url = new URL(`/demo/${scenario.key}`, window.location.origin);
          url.searchParams.set("returnUrl", callbackUrl);
          window.location.href = url.toString();
        });
        buttons.appendChild(button);
      });

      const params = new URLSearchParams(window.location.search);
      const demoResult = params.get("demoResult");
      if (demoResult) {
        let parsed;
        try {
          parsed = JSON.parse(demoResult);
        } catch (error) {
          parsed = { error: "Failed to parse returned demo payload", details: String(error) };
        }
        document.getElementById("result-json").textContent = JSON.stringify(parsed, null, 2);
        document.getElementById("result-section").style.display = "block";
        history.replaceState({}, "", window.location.pathname);
      }
    </script>
  </body>
</html>
